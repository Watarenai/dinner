<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>食材スロット</title>
  <style>
    /* === リセット・ベース === */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      padding: 24px 16px;
    }

    /* === タイトル === */
    h1 {
      font-size: 1.6rem;
      margin-bottom: 24px;
      text-align: center;
    }

    /* === スロットエリア === */
    .slot-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      width: 100%;
      max-width: 500px;
    }

    /* === リール行（カテゴリごと） === */
    .reel-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .reel-group-label {
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 0.1em;
    }
    /* F-009: 野菜と肉のカテゴリ色分け */
    .reel-group-label.veg { color: #66bb6a; }
    .reel-group-label.meat { color: #ef5350; }

    .reel-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* === リール本体 === */
    .reel-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .reel {
      width: 100px;
      height: 100px;
      overflow: hidden;
      border: 3px solid #444;
      border-radius: 10px;
      background: #fff;
      position: relative;
    }
    /* F-009: カテゴリ別ボーダー色 */
    .reel.veg  { border-color: #66bb6a; }
    .reel.meat { border-color: #ef5350; }

    /* F-010: 停止時の滑らかなスナップ */
    .reel ul {
      list-style: none;
      padding: 0;
      margin: 0;
      position: absolute;
      top: 0;
    }
    .reel.stopped ul {
      transition: top 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .reel li {
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: bold;
      color: #333;
    }

    /* === ストップボタン（リール下） === */
    .stop-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .stop-btn:active { transform: scale(0.95); }
    .stop-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .stop-btn.veg  { background: #43a047; }
    .stop-btn.meat { background: #e53935; }

    /* === 操作ボタン === */
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .ctrl-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .ctrl-btn:active { transform: scale(0.96); }
    #stopAll  { background: #ff9800; }
    #reset    { background: #607d8b; }

    /* === 結果表示 === */
    #result {
      font-size: 1.2rem;
      text-align: center;
      min-height: 1.6em;
      padding: 12px 20px;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      width: 100%;
      max-width: 500px;
    }

    /* === F-008: レスポンシブ（スマホ最適化） === */
    @media (max-width: 480px) {
      body { padding: 16px 8px; }
      h1 { font-size: 1.3rem; margin-bottom: 16px; }
      .reel-row { gap: 6px; }
      .reel, .reel li {
        width: 80px;
        height: 80px;
      }
      .reel li { font-size: 13px; }
      .stop-btn { padding: 6px 12px; font-size: 0.75rem; }
      .ctrl-btn { padding: 10px 18px; font-size: 0.9rem; }
      #result { font-size: 1rem; padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <h1>🎰 食材スロット</h1>

  <div class="slot-area">
    <!-- 野菜リール群 -->
    <div class="reel-group">
      <span class="reel-group-label veg">🥬 野菜</span>
      <div class="reel-row">
        <div class="reel-wrapper">
          <div class="reel veg" id="reel1"><ul></ul></div>
          <button class="stop-btn veg" id="stop1">ストップ</button>
        </div>
        <div class="reel-wrapper">
          <div class="reel veg" id="reel2"><ul></ul></div>
          <button class="stop-btn veg" id="stop2">ストップ</button>
        </div>
        <div class="reel-wrapper">
          <div class="reel veg" id="reel3"><ul></ul></div>
          <button class="stop-btn veg" id="stop3">ストップ</button>
        </div>
      </div>
    </div>

    <!-- 肉リール -->
    <div class="reel-group">
      <span class="reel-group-label meat">🥩 肉</span>
      <div class="reel-row">
        <div class="reel-wrapper">
          <div class="reel meat" id="reel4"><ul></ul></div>
          <button class="stop-btn meat" id="stop4">ストップ</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 操作ボタン -->
  <div class="controls">
    <button class="ctrl-btn" id="stopAll">一斉ストップ</button>
    <button class="ctrl-btn" id="reset">リセット</button>
  </div>

  <!-- 結果表示 -->
  <div id="result"></div>

  <!-- 効果音 -->
  <audio id="slot-sound" src="slot-sound.mp3" preload="auto"></audio>

  <script>
    /* === 食材データ === */
    var vegIngredients = [
      'だいこん','にんじん','じゃがいも','たまねぎ','キャベツ','レタス',
      'ほうれんそう','こまつな','なす','きゅうり','トマト','ピーマン',
      'さつまいも','ねぎ','しそ','ごぼう','とうもろこし','かぼちゃ','ブロッコリー'
    ];
    var meatIngredients = ['牛肉','鶏肉','豚肉'];

    /* === 定数 === */
    var ITEM_SIZE = 100; // px（リールアイテムの高さ）

    /* === ユーティリティ === */
    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    }

    /* === DOM参照 === */
    var sound = document.getElementById('slot-sound');
    sound.loop = true;

    var REEL_COUNT = 4;
    var reelEls = [];
    var stopBtns = [];
    for (var i = 0; i < REEL_COUNT; i++) {
      reelEls.push(document.querySelector('#reel' + (i + 1) + ' ul'));
      stopBtns.push(document.getElementById('stop' + (i + 1)));
    }

    /* リールごとの食材プール */
    var reelData = [vegIngredients, vegIngredients, vegIngredients, meatIngredients];

    /* === 状態管理 === */
    var intervals = [];
    for (var i = 0; i < REEL_COUNT; i++) { intervals.push(null); }

    /* レスポンシブ対応: 実際のアイテムサイズを取得 */
    function getItemSize() {
      var firstItem = document.querySelector('.reel li');
      return firstItem ? firstItem.offsetHeight : ITEM_SIZE;
    }

    /* === リール初期化: シャッフルした食材をDOMに投入 === */
    function buildReel(index) {
      var ul = reelEls[index];
      ul.innerHTML = '';
      var order = shuffle(reelData[index].slice());
      /* ループのために2倍に複製 */
      var full = order.concat(order);
      for (var j = 0; j < full.length; j++) {
        var li = document.createElement('li');
        li.textContent = full[j];
        ul.appendChild(li);
      }
    }

    /* === スピン開始 === */
    function spinReel(index) {
      if (intervals[index]) return;

      var reelDiv = reelEls[index].parentElement;
      reelDiv.classList.remove('stopped');

      /* F-007: リールごとにランダムな速度 */
      var step = Math.floor(Math.random() * 11) + 5;   // 5〜15px
      var delay = Math.floor(Math.random() * 41) + 20;  // 20〜60ms

      intervals[index] = setInterval(function() {
        var top = parseInt(reelEls[index].style.top) || 0;
        top -= step;
        if (Math.abs(top) >= reelEls[index].scrollHeight / 2) {
          top = 0;
        }
        reelEls[index].style.top = top + 'px';
      }, delay);

      stopBtns[index].disabled = false;

      /* F-006: 効果音再生 */
      if (sound.paused) {
        sound.play().catch(function() {});
      }
    }

    /* === リール停止 === */
    function stopReel(index) {
      if (!intervals[index]) return;
      clearInterval(intervals[index]);
      intervals[index] = null;

      var ul = reelEls[index];
      var reelDiv = ul.parentElement;
      var itemSize = getItemSize();
      var total = ul.scrollHeight / 2;
      var curr = Math.abs(parseInt(ul.style.top) || 0) % total;
      var snapIndex = Math.round(curr / itemSize);

      /* F-010: stoppedクラスでtransition有効化 → 滑らかにスナップ */
      reelDiv.classList.add('stopped');
      ul.style.top = -(snapIndex * itemSize) + 'px';

      stopBtns[index].disabled = true;

      /* 全リール停止チェック */
      var allStopped = true;
      for (var i = 0; i < REEL_COUNT; i++) {
        if (intervals[i] !== null) { allStopped = false; break; }
      }
      if (allStopped) {
        sound.pause();
        sound.currentTime = 0;
        showResult();
      }
    }

    /* === 結果表示 === */
    function showResult() {
      var itemSize = getItemSize();
      var results = [];
      for (var i = 0; i < REEL_COUNT; i++) {
        var pos = Math.abs(parseInt(reelEls[i].style.top) || 0) / itemSize;
        results.push(reelEls[i].children[pos].textContent);
      }
      document.getElementById('result').textContent = '🍽️ 選ばれた食材: ' + results.join('、');
    }

    /* === 一斉ストップ === */
    function stopAll() {
      for (var i = 0; i < REEL_COUNT; i++) {
        stopReel(i);
      }
    }

    /* === リセット（リビルド＆再スピン） === */
    function resetReels() {
      /* 回転中のインターバルをクリア */
      for (var i = 0; i < REEL_COUNT; i++) {
        if (intervals[i]) { clearInterval(intervals[i]); intervals[i] = null; }
        reelEls[i].style.top = '0px';
        reelEls[i].parentElement.classList.remove('stopped');
      }
      document.getElementById('result').textContent = '';
      sound.currentTime = 0;

      /* 食材を再シャッフルして全リール再構築 */
      for (var i = 0; i < REEL_COUNT; i++) {
        buildReel(i);
        spinReel(i);
      }
    }

    /* === 初期化 === */
    for (var i = 0; i < REEL_COUNT; i++) {
      buildReel(i);
      spinReel(i);
    }

    /* === イベント登録 === */
    for (var i = 0; i < REEL_COUNT; i++) {
      (function(idx) {
        stopBtns[idx].addEventListener('click', function() { stopReel(idx); });
      })(i);
    }
    document.getElementById('stopAll').addEventListener('click', stopAll);
    document.getElementById('reset').addEventListener('click', resetReels);
  </script>
</body>
</html>
